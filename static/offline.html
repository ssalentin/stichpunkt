<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<meta name="color-scheme" content="dark light" />
<title>Offline · stichpunkt</title>
<style>
	:root { --bg: #0e1116; --fg: #e6edf3; --muted: #8b96a3; --accent: #f5b544; }
	@media (prefers-color-scheme: light) { :root { --bg: #f6f3ec; --fg: #14181f; --muted: #5b6672; --accent: #a84f00; } }
	body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
		background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
	img { width: 72px; height: 72px; }
	h1 { margin: 1rem 0 0.25rem; font-size: 1.4rem; }
	p { margin: 0.25rem 0; color: var(--muted); }
	a { display: inline-block; margin-top: 1.25rem; padding: 0.5rem 1.1rem; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<main>
	<img src="/icon-192.png" alt="" />
	<h1>You're offline</h1>
	<p>This page hasn't been opened before, so it isn't saved on this device.</p>
	<p>Pages you've visited recently stay readable offline.</p>
	<a href="/">Back to start</a>
</main>
</body>
</html>
