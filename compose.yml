# Sample stack: stichpunkt behind a reverse proxy. Adapt labels/volumes to your proxy.
# Copy .env.example to .env and fill MDWIKI_API_TOKEN before `docker compose up -d`.
services:
  stichpunkt:
    build:
      context: .
      args:
        STICHPUNKT_COMMIT: ${STICHPUNKT_COMMIT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      SPACE_DIR: /space
    volumes:
      - ./space:/space          # the markdown directory (read-write)
    networks: [web]
    # Traefik: route the UI through Authelia forwardAuth, and /mcp + /api on a
    # separate router WITHOUT Authelia (they are protected by the bearer token).
    # labels: [...]
    #   - UI router (Authelia forwardAuth): must NOT set X-Mdwiki-Zone.
    #   - Token router (rule: Path(`/mcp`) || PathPrefix(`/mcp/`) || Path(`/api`) || PathPrefix(`/api/`);
    #     a bare PathPrefix(`/api`) would also match /apix): add a `headers` middleware with
    #       customRequestHeaders.X-Mdwiki-Zone=machine
    #     (it overwrites anything the client sent). The app then demands the bearer
    #     token for every path on that router, not only /api and /mcp.

networks:
  web: {}
